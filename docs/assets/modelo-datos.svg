umber · years_in_team</text></g><g><rect x="720" y="110" width="240" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M730 110H950Q960 110 960 120V150H720V120Q720 110 730 110" fill="#ecfdf5"/><text x="736" y="138" font-size="21" font-weight="700" fill="#047857">Player</text><text x="736" y="178" font-size="17">PK/FK footballer_id</text><text x="736" y="203" font-size="17">position</text></g><g><rect x="40" y="300" width="260" height="115" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M50 300H290Q300 300 300 310V340H40V310Q40 300 50 300" fill="#ecfdf5"/><text x="56" y="328" font-size="21" font-weight="700" fill="#047857">Stadium</text><text x="56" y="368" font-size="17">PK id</text><text x="56" y="393" font-size="17">name · capacity</text></g><g><rect x="380" y="310" width="260" height="145" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M390 310H630Q640 310 640 320V350H380V320Q380 310 390 310" fill="#ecfdf5"/><text x="396" y="338" font-size="21" font-weight="700" fill="#047857">Match</text><text x="396" y="378" font-size="17">PK id · FK equipos / sede</text><text x="396" y="403" font-size="17">FK season_id · match_date</text><text x="396" y="428" font-size="17">attendance · disputed</text></g><g><rect x="720" y="305" width="240" height="125" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M730 305H950Q960 305 960 315V345H720V315Q720 305 730 305" fill="#ecfdf5"/><text x="736" y="333" font-size="21" font-weight="700" fill="#047857">Coach</text><text x="736" y="373" font-size="17">PK/FK footballer_id</text><text x="736" y="398" font-size="17">experience_years</text><text x="736" y="423" font-size="17">championships_won</text></g><g><rect x="40" y="490" width="260" height="115" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M50 490H290Q300 490 300 500V530H40V500Q40 490 50 490" fill="#ecfdf5"/><text x="56" y="518" font-size="21" font-weight="700" fill=